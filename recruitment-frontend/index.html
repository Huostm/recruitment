<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能招聘助手</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <header class="header">
            <h1>智能招聘助手</h1>
            <p class="subtitle">AI-Powered Recruitment System</p>
        </header>

        <!-- 统计面板 -->
        <section class="statistics">
            <div class="stat-card">
                <div class="stat-number" id="totalCount">0</div>
                <div class="stat-label">总候选人</div>
            </div>
            <div class="stat-card approved">
                <div class="stat-number" id="approvedCount">0</div>
                <div class="stat-label">已通过</div>
            </div>
            <div class="stat-card pending">
                <div class="stat-number" id="pendingCount">0</div>
                <div class="stat-label">待审核</div>
            </div>
            <div class="stat-card rejected">
                <div class="stat-number" id="rejectedCount">0</div>
                <div class="stat-label">已拒绝</div>
            </div>
        </section>

        <!-- 功能区 -->
        <section class="actions">
            <div class="upload-section">
                <h2>上传简历</h2>
                <div class="upload-area" id="uploadArea">
                    <input type="file" id="fileInput" accept=".pdf" style="display: none;">
                    <div class="upload-icon">📄</div>
                    <p>点击或拖拽上传 PDF 简历</p>
                    <span class="file-hint">仅支持 PDF 格式</span>
                </div>
                <div id="uploadProgress" class="upload-progress" style="display: none;">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <p class="progress-text" id="progressText">处理中...</p>
                </div>
            </div>
        </section>

        <!-- 候选人列表 -->
        <section class="candidates-section">
            <div class="section-header">
                <h2>候选人列表</h2>
                <div class="filter-tabs">
                    <button class="tab active" data-status="">全部</button>
                    <button class="tab" data-status="approved">已通过</button>
                    <button class="tab" data-status="pending">待审核</button>
                    <button class="tab" data-status="rejected">已拒绝</button>
                </div>
            </div>

            <div class="candidates-list" id="candidatesList">
                <!-- 候选人卡片将动态插入这里 -->
            </div>

            <!-- 分页 -->
            <div class="pagination" id="pagination">
                <button class="btn-page" id="prevPage">上一页</button>
                <span class="page-info" id="pageInfo">第 1 页</span>
                <button class="btn-page" id="nextPage">下一页</button>
            </div>
        </section>
    </div>

    <!-- 候选人详情模态框 -->
    <div class="modal" id="detailModal">
        <div class="modal-content">
            <span class="modal-close" id="closeModal">&times;</span>
            <h2>候选人详情</h2>
            <div id="candidateDetail"></div>
        </div>
    </div>

    <!-- 审批模态框 -->
    <div class="modal" id="approveModal">
        <div class="modal-content">
            <span class="modal-close" id="closeApproveModal">&times;</span>
            <h2>人工审批</h2>
            <div id="approveForm">
                <div class="form-group">
                    <label>审批决定</label>
                    <select id="approveDecision" class="form-control">
                        <option value="approved">通过</option>
                        <option value="rejected">拒绝</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>审批理由</label>
                    <textarea id="approveReason" class="form-control" rows="4" placeholder="请输入审批理由..."></textarea>
                </div>
                <div class="form-actions">
                    <button class="btn btn-cancel" id="cancelApprove">取消</button>
                    <button class="btn btn-primary" id="confirmApprove">确认</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 面试邀请模态框 -->
    <div class="modal" id="inviteModal">
        <div class="modal-content">
            <span class="modal-close" id="closeInviteModal">&times;</span>
            <h2>发送面试邀请</h2>
            <div id="inviteForm">
                <div class="form-group">
                    <label>候选人姓名</label>
                    <input type="text" id="inviteName" class="form-control" readonly>
                </div>
                <div class="form-group">
                    <label>邮箱地址</label>
                    <input type="email" id="inviteEmail" class="form-control" readonly>
                </div>
                <div class="form-group">
                    <label>面试时间</label>
                    <input type="datetime-local" id="inviteTime" class="form-control">
                </div>
                <div class="form-group">
                    <label>面试地点</label>
                    <input type="text" id="inviteLocation" class="form-control" placeholder="请输入面试地点...">
                </div>
                <div class="form-actions">
                    <button class="btn btn-cancel" id="cancelInvite">取消</button>
                    <button class="btn btn-primary" id="confirmInvite">发送邀请</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>

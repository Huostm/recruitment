spring:
  application:
    name: recruitment-backend
  datasource:
    url: jdbc:postgresql://192.168.150.103:5432/recruitment_db
    username: recruitment_user
    password:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  mail:
    host: smtp.qq.com
    port: 587
    username: @qq.com
    password:
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

agent:
  service:
    url: http://localhost:5000